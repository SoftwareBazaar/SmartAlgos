<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Algos Trading Platform</title>
    <meta name="description" content="Smart Algos Trading Platform - Advanced Algorithmic Trading Solutions">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/logo192.png">
    <link rel="manifest" href="/manifest.json">
    <link href="/static/css/main.0a6b08da.css" rel="stylesheet">
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
        <div style="
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
        ">
            <div>
                <h1 style="font-size: 3rem; margin-bottom: 1rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
                    🚀 Smart Algos
                </h1>
                <p style="font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.9;">
                    AI-Powered Trading Platform
                </p>
                <div style="
                    display: inline-block;
                    width: 40px;
                    height: 40px;
                    border: 4px solid rgba(255,255,255,0.3);
                    border-radius: 50%;
                    border-top-color: white;
                    animation: spin 1s ease-in-out infinite;
                    margin-bottom: 2rem;
                "></div>
                <p style="font-size: 1.1rem; line-height: 1.6;">
                    Loading your trading dashboard...
                </p>
                <p style="font-size: 0.9rem; margin-top: 2rem; opacity: 0.7;">
                    If this page doesn't load properly, please refresh.
                </p>
            </div>
        </div>
    </div>
    
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    <script src="/static/js/main.f9f6bdfc.js"></script>
