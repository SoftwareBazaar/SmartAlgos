[phases.setup]
nixPkgs = ["nodejs-18_x", "npm-9_x"]

[phases.install]
cmds = [
  "npm ci --only=production",
  "cd client && npm ci && cd .."
]

[phases.build]
cmds = [
  "cd client && npm run build && cd ..",
  "cp -r client/build/* ."
]

[start]
cmd = "node server.js"

[variables]
NODE_ENV = "production"
MOCK_AUTH = "false"

