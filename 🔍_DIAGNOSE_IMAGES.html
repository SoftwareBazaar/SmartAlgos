<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; img-src 'self' https://ncikobfahncdgwvkfivz.supabase.co data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://ncikobfahncdgwvkfivz.supabase.co wss://ncikobfahncdgwvkfivz.supabase.co https://web-production-fdb58.up.railway.app; font-src 'self' data:; object-src 'none'; base-uri 'self';">
    <title>🔍 Image Diagnostic Tool</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #e74c3c;
            margin-bottom: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        .test-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .result {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        .info { background: #d1ecf1; color: #0c5460; }
        .image-test {
            display: flex;
            gap: 20px;
            margin: 15px 0;
        }
        .image-preview {
            width: 200px;
            height: 150px;
            border: 2px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }
        .image-info {
            flex: 1;
        }
        .url {
            word-break: break-all;
            font-family: monospace;
            background: #f1f3f4;
            padding: 8px;
            border-radius: 4px;
            margin: 5px 0;
        }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 10px 5px;
        }
        .btn:hover { background: #2980b9; }
        .console {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin: 15px 0;
        }
        .log-entry {
            margin: 3px 0;
            padding: 2px 0;
        }
        .log-success { color: #4ade80; }
        .log-error { color: #f87171; }
        .log-warning { color: #fbbf24; }
        .log-info { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Image Diagnostic Tool</h1>
        <p>This tool will check what's happening with your EA images.</p>

        <div class="test-section">
            <div class="test-title">Test 1: Fetch EA Data from API</div>
            <button class="btn" onclick="testAPI()">Fetch EA Data</button>
            <div id="api-result"></div>
        </div>

        <div class="test-section">
            <div class="test-title">Test 2: Check Image URLs</div>
            <div id="image-urls"></div>
        </div>

        <div class="test-section">
            <div class="test-title">Test 3: Test Image Loading</div>
            <div id="image-tests"></div>
        </div>

        <div class="test-section">
            <div class="test-title">Console Output</div>
            <div class="console" id="console-output">
                <div class="log-entry log-info">🔍 Ready to diagnose image issues...</div>
            </div>
        </div>

        <div class="test-section">
            <div class="test-title">Summary</div>
            <div id="summary"></div>
        </div>
    </div>

    <script>
        let eas = [];
        let consoleDiv = document.getElementById('console-output');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            const icon = {
                error: '❌',
                success: '✅',
                info: 'ℹ️',
                warning: '⚠️'
            }[type] || 'ℹ️';
            entry.textContent = `[${timestamp}] ${icon} ${message}`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console[type === 'error' ? 'error' : 'log'](message);
        }

        async function testAPI() {
            log('Testing API endpoint...', 'info');
            const resultDiv = document.getElementById('api-result');
            
            try {
                const response = await fetch('https://web-production-fdb58.up.railway.app/api/eas');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                eas = await response.json();
                log(`✅ API returned ${eas.length} EAs`, 'success');
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        ✅ API Working: Found ${eas.length} EAs
                    </div>
                `;
                
                // Show first few EAs
                const easList = eas.slice(0, 3).map(ea => `
                    <div style="margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 4px;">
                        <strong>${ea.name}</strong><br>
                        <span class="url">Image: ${ea.image || 'NO IMAGE'}</span><br>
                        <span class="url">ID: ${ea.id}</span>
                    </div>
                `).join('');
                
                resultDiv.innerHTML += `
                    <div style="margin-top: 15px;">
                        <strong>First 3 EAs:</strong>
                        ${easList}
                    </div>
                `;
                
                checkImageUrls();
                
            } catch (error) {
                log(`❌ API Error: ${error.message}`, 'error');
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ API Error: ${error.message}
                    </div>
                `;
            }
        }

        function checkImageUrls() {
            log('Analyzing image URLs...', 'info');
            const urlsDiv = document.getElementById('image-urls');
            
            const easWithImages = eas.filter(ea => ea.image);
            const easWithoutImages = eas.filter(ea => !ea.image);
            
            let html = `
                <div class="result info">
                    📊 Image Analysis:<br>
                    • EAs with images: ${easWithImages.length}<br>
                    • EAs without images: ${easWithoutImages.length}<br>
                    • Total EAs: ${eas.length}
                </div>
            `;
            
            if (easWithImages.length > 0) {
                html += '<div style="margin-top: 15px;"><strong>EAs with images:</strong></div>';
                easWithImages.slice(0, 3).forEach(ea => {
                    const isSupabaseUrl = ea.image.includes('supabase.co');
                    const isLocalUrl = ea.image.startsWith('/uploads/');
                    
                    html += `
                        <div style="margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 4px;">
                            <strong>${ea.name}</strong><br>
                            <span class="url">${ea.image}</span><br>
                            <span style="color: ${isSupabaseUrl ? 'green' : isLocalUrl ? 'orange' : 'red'};">
                                ${isSupabaseUrl ? '✅ Supabase URL' : isLocalUrl ? '⚠️ Local URL (broken)' : '❌ Unknown URL type'}
                            </span>
                        </div>
                    `;
                });
            }
            
            if (easWithoutImages.length > 0) {
                html += '<div style="margin-top: 15px;"><strong>EAs without images:</strong></div>';
                easWithoutImages.slice(0, 3).forEach(ea => {
                    html += `
                        <div style="margin: 10px 0; padding: 10px; background: #fff3cd; border-radius: 4px;">
                            <strong>${ea.name}</strong><br>
                            <span style="color: #856404;">⚠️ No image URL in database</span>
                        </div>
                    `;
                });
            }
            
            urlsDiv.innerHTML = html;
            
            // Test image loading
            if (easWithImages.length > 0) {
                testImageLoading();
            }
        }

        function testImageLoading() {
            log('Testing image loading...', 'info');
            const testsDiv = document.getElementById('image-tests');
            
            const easWithImages = eas.filter(ea => ea.image);
            let html = '<div><strong>Image Loading Tests:</strong></div>';
            
            easWithImages.slice(0, 3).forEach((ea, index) => {
                const testId = `test-${index}`;
                html += `
                    <div class="image-test">
                        <div class="image-preview" id="preview-${testId}">
                            <div>Loading...</div>
                        </div>
                        <div class="image-info">
                            <div><strong>${ea.name}</strong></div>
                            <div class="url">${ea.image}</div>
                            <div id="status-${testId}">Testing...</div>
                        </div>
                    </div>
                `;
            });
            
            testsDiv.innerHTML = html;
            
            // Test each image
            easWithImages.slice(0, 3).forEach((ea, index) => {
                testSingleImage(ea, index);
            });
        }

        function testSingleImage(ea, index) {
            const testId = `test-${index}`;
            const previewDiv = document.getElementById(`preview-${testId}`);
            const statusDiv = document.getElementById(`status-${testId}`);
            const img = new Image();
            
            img.onload = function() {
                log(`✅ Image loaded: ${ea.name}`, 'success');
                previewDiv.innerHTML = `<img src="${ea.image}" alt="${ea.name}">`;
                statusDiv.innerHTML = '<span style="color: green;">✅ Image loaded successfully</span>';
            };
            
            img.onerror = function() {
                log(`❌ Image failed: ${ea.name} - ${ea.image}`, 'error');
                previewDiv.innerHTML = '<div style="color: red;">❌ Failed to load</div>';
                statusDiv.innerHTML = '<span style="color: red;">❌ Failed to load image</span>';
            };
            
            img.src = ea.image;
        }

        function updateSummary() {
            const summaryDiv = document.getElementById('summary');
            const easWithImages = eas.filter(ea => ea.image);
            const supabaseUrls = easWithImages.filter(ea => ea.image.includes('supabase.co'));
            const localUrls = easWithImages.filter(ea => ea.image.startsWith('/uploads/'));
            
            let summary = `
                <div class="result info">
                    📊 Summary:<br>
                    • Total EAs: ${eas.length}<br>
                    • EAs with images: ${easWithImages.length}<br>
                    • Supabase URLs: ${supabaseUrls.length}<br>
                    • Local URLs: ${localUrls.length}<br>
                    • No images: ${eas.length - easWithImages.length}
                </div>
            `;
            
            if (localUrls.length > 0) {
                summary += `
                    <div class="result warning">
                        ⚠️ Found ${localUrls.length} EAs with local URLs (broken after deployment)
                    </div>
                `;
            }
            
            if (supabaseUrls.length > 0) {
                summary += `
                    <div class="result success">
                        ✅ Found ${supabaseUrls.length} EAs with Supabase URLs (should work)
                    </div>
                `;
            }
            
            summaryDiv.innerHTML = summary;
        }

        // Auto-run when page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                testAPI();
            }, 500);
        });
    </script>
</body>
</html>
