# Render Blueprint for Smart Algos Trading Platform
# This file configures automatic deployment of both backend and frontend

services:
  # Backend API Server with WebSocket support
  - type: web
    name: smart-algos-api
    env: node
    region: oregon  # Change to your preferred region
    plan: free  # Options: free, starter ($7/mo), standard ($25/mo)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    
    # Environment variables
    envVars:
      # Node environment
      - key: NODE_ENV
        value: production
      
      # Server port (Render sets this automatically)
      - key: PORT
        value: 10000
      
      # JWT Configuration
      - key: JWT_SECRET
        generateValue: true  # Render will auto-generate a secure secret
      - key: JWT_EXPIRE
        value: 7d
      
      # Security
      - key: BCRYPT_ROUNDS
        value: 12
      
      # Supabase Configuration (You need to add these manually in Render dashboard)
      - key: SUPABASE_URL
        sync: false  # Add manually: https://your-project.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false  # Add manually from Supabase dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false  # Add manually from Supabase dashboard
      
      # API Keys (Add these manually in Render dashboard)
      - key: POLYGON_API_KEY
        sync: false  # Get from: https://polygon.io
      - key: MARKETAUX_API_KEY
        sync: false  # Get from: https://www.marketaux.com
      - key: NSE_API_KEY
        sync: false  # Optional: NSE API key
      
      # CORS Configuration
      - key: CLIENT_URL
        value: https://smart-algos-web.onrender.com  # Update with your frontend URL
      - key: ALLOWED_ORIGINS
        value: https://smart-algos-web.onrender.com  # Update with your frontend URL
      
      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000  # 15 minutes
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      
      # Email Configuration (Optional - add if using email features)
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false  # Add manually
      - key: EMAIL_PASS
        sync: false  # Add manually (use app password)
      
      # WebSocket Configuration
      - key: WS_PORT
        value: 5001
      
      # Redis Configuration (Optional - if you add Redis)
      - key: REDIS_URL
        sync: false  # Add manually if using Redis

  # Frontend React Application
  - type: web
    name: smart-algos-web
    env: static
    region: oregon
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/build
    
    # Routes configuration for React Router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    
    # Frontend environment variables
    envVars:
      - key: REACT_APP_API_URL
        value: https://smart-algos-api.onrender.com  # Update with your backend URL
      - key: REACT_APP_WS_URL
        value: wss://smart-algos-api.onrender.com  # Update with your backend URL (use wss://)
      - key: REACT_APP_VISME_EMBED_ENABLED
        value: false
      - key: DISABLE_ESLINT_PLUGIN
        value: true
      - key: CI
        value: false

